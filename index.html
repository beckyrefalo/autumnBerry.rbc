<!DOCTYPE html>
<html lang="en">
<head>
    <!--This is the main page of the website-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutumnBerry</title>

 <!--This is links the homepage to the stylesheet-->
  <link rel="stylesheet" href="style.css">

 <!--This link is used for the sans-serif thin-weight font found in the logo and any other headers-->
    <link href="https://fonts.googleapis.com/css2?family=Smooch+Sans:wght@100..900&display=swap" rel="stylesheet">

 <!--This link is used for the cursive font found in the logo and any other headers-->
 <link href="https://fonts.googleapis.com/css2?family=Petit+Formal+Script&display=swap" rel="stylesheet">
</head>
<body>
    

  <!-- TOP NAV -->
<nav class="top-nav">
  <div class="hamburger">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <div class="top-icons">
    <a href="#" id="search-toggle">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="1.5">
        <circle cx="11" cy="11" r="7"/>
        <line x1="16.5" y1="16.5" x2="22" y2="22"/>
      </svg>
    </a>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="1.5">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
    </svg>
  </div>

<!-- Search bar overlays the nav -->
<div class="search-bar" id="search-bar">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="1.5" fill="none" stroke="#888">
    <circle cx="11" cy="11" r="7"/>
    <line x1="16.5" y1="16.5" x2="22" y2="22"/>
  </svg>
  <input type="text" placeholder="Search..." id="search-input">
  <span id="search-close">✕</span>
</div>
 </nav>

  <!-- LOGO -->
  <div class="logo-section">
    <span class="logo-top">Autumn</span>
    <span class="logo-script">berry</span>
  </div>
 
  <!-- MAIN NAV -->
  <nav class="main-nav">
    <a href="#">Content</a>
    <a href="#">Blog</a>
  </nav>
 
  <!-- CATEGORY BAR -->
  <div class="category-bar">
    <a href="#">| Femme</a>
    <a href="#">| Class</a>
    <a href="#">| Luxury</a>
    <a href="#">| Intentional</a>
    <a href="#">| Society</a>
  </div>
 
  <!-- HERO -->
  <div class="hero">
    <div class="hero-placeholder">Hero Image</div>
  </div>


<script>
  const toggle = document.getElementById('search-toggle');
  const bar = document.getElementById('search-bar');
  const close = document.getElementById('search-close');
  const input = document.getElementById('search-input');

  toggle.addEventListener('click', (e) => {
    e.preventDefault();
    bar.classList.add('active');
    input.focus();
  });

  close.addEventListener('click', () => {
    bar.classList.remove('active');
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') bar.classList.remove('active');
  });
</script>
</body>
</html>
